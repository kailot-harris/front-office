name: R Unit Tests & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'

      - name: Restore renv cache
        uses: actions/cache@v4
        with:
          path: renv/library
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      # renv.lock pins its repository to a DATED Posit Package Manager snapshot
      # (.../cran/2026-10-20), not .../cran/latest. This is load-bearing on
      # Windows: P3M only keeps Windows binaries for the versions that were
      # current at that snapshot. Against "latest", any package whose locked
      # version has since been superseded falls back to a source build — which
      # is how duckdb 1.5.6 (superseded by 2.0.0) started compiling from source
      # here and killed the job before the tests ever ran. If you re-snapshot
      # the lockfile, move the date forward with it; don't point it at "latest".
      - name: Restore renv environment
        shell: Rscript {0}
        # RENV_CONFIG_REPOS_OVERRIDE is exported into this job's environment
        # pointing at .../cran/latest, and it beats the lockfile's own
        # Repositories entry — so pinning the snapshot in renv.lock alone was
        # silently ignored (run 40227674728). Set it here to the same dated
        # snapshot the lockfile uses; the two must stay in step.
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/2026-10-20
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()

      - name: Run testthat unit test suite
        shell: Rscript {0}
        run: |
          test_res <- testthat::test_dir('tests/testthat', stop_on_failure = TRUE)
          df_res <- as.data.frame(test_res)
          if (any(df_res$failed > 0)) {
            stop("Unit tests failed!")
          }
