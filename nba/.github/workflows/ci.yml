# ==============================================================================
# CI for NBA Analytics
#
# Two independent jobs, because the repo is two codebases:
#
#   web  - the Next.js app. Delegates to `npm test`, i.e. web/scripts/run-test-suite.mjs,
#          which already runs typecheck -> lint -> vitest(node) -> vitest(components)
#          -> build -> playwright in cheapest-first order and reconciles failures
#          against web/tests/known-issues.json. CI deliberately calls that one
#          command rather than re-listing the stages here, so the merge gate and
#          the local command cannot drift apart.
#   r    - the R pipeline. Parses every tracked .R file (syntax only, nothing is
#          executed), then runs tests/test_*.R.
#
# Nothing here runs the pipeline itself: every stage hits paid sports-data APIs
# and takes hours. The R job only loads stage files for their definitions, via
# NBA_SKIP_STAGE_AUTORUN=1.
#
# No secrets are used or needed. Do not add ODDS_API_KEY or DISCORD_WEBHOOK
# here: a workflow that can reach them is a workflow a pull request from a fork
# could be made to reach them through.
# ==============================================================================
name: CI

# CI does not run on pushes to main. Nearly every change reaches main through a
# pull request that has already run this workflow, and the scheduled data
# publishes are gated locally before they are committed, so the post-merge run
# only repeated work. Use workflow_dispatch to check main on demand.
on:
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Manually dispatched runs
# are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: @playwright/test pins the browser build, so a
      # lockfile change is exactly when the cached browser goes stale.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own exit code is the gate: a failure listed in
      # known-issues.json is reported as KNOWN and tolerated, anything else is a
      # REGRESSION and fails. That baseline is the repo's documented policy, so
      # this is plain `npm test` and not --strict.
      - name: Run the web test suite
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn

  r:
    name: R pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Stage entrypoints end in a call that runs the real stage. The tests load
      # them for their definitions only; without this they would hit live APIs.
      NBA_SKIP_STAGE_AUTORUN: '1'
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # Cheap and needs no packages, so it runs before the long install and
      # fails fast on a syntax error anywhere in the pipeline.
      - name: Parse every tracked R file
        run: Rscript .github/scripts/parse-all.R

      # Static analysis (parse-only, no packages, no execution): fails the
      # build if any tools/gif_*.R or tools/plot_*.R chart script contains a
      # code path that can draw non-data-derived values (random generators,
      # hand-typed data tables, or a missing-input fallback that fabricates a
      # data frame instead of calling viz_stop_no_data()). See front-office#142
      # and front-office#143 / NBA_analytics#103 for the incident this guards
      # against.
      - name: Check chart scripts for non-data-derived values
        run: Rscript .github/scripts/check-chart-authenticity.R

      # The cached library holds compiled packages linked against the runner
      # image's system libraries. runner.os is just "Linux", so when
      # ubuntu-latest moved from 24.04 to 26.04 the old cache was restored onto
      # the new image and stringi failed to load (libicui18n.so.74 missing),
      # taking tidyverse and most of the suite with it. Keying on the image
      # (ImageOS, e.g. "ubuntu26") rebuilds the library when the image changes.
      - name: Record the runner image for the cache key
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-R4.5-${{ hashFiles('.github/r-dependencies.txt') }}

      # ggimage (tools/gif_net_rating_quadrant.R) loads magick, whose prebuilt
      # binary links against the image's ImageMagick C++ runtime
      # (libMagick++-7.Q16.so.5 on ubuntu26). The runner does not ship it. The
      # -dev package is used because its name is stable across images and it
      # pulls in whichever runtime version the image carries.
      - name: Install ImageMagick for the magick R package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagick++-dev

      - name: Install R dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript .github/scripts/install-deps.R

      - name: Run R tests
        run: Rscript .github/scripts/run-tests.R
