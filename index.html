<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Front Office</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #0b0d12;
      color: #e7e9ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 1rem;
    }
    a.card {
      display: block;
      padding: 1.25rem 2rem;
      border: 1px solid #262a35;
      border-radius: 0.75rem;
      background: #12151c;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      text-align: center;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    a.card:hover { border-color: #4a7dff; transform: translateY(-2px); }
  </style>
</head>
<body>
  <h1>Front Office</h1>
  <nav>
    <a class="card" href="nba/">NBA</a>
    <a class="card" href="wnba/">WNBA</a>
    <a class="card" href="mlb/">MLB</a>
    <a class="card" href="nfl/">NFL</a>
  </nav>
</body>
</html>
