# ==============================================================================
# CI for NFL Analytics
#
# Lifted from NBA Analytics's .github/workflows/ci.yml, which is a proven live
# model rather than a template. The web job below is a direct copy: this repo
# already has web/scripts/run-test-suite.mjs and web/tests/known-issues.json,
# so nothing about it needed adapting.
#
#   web  - the Next.js app. Delegates to `npm test`, i.e. web/scripts/run-test-suite.mjs,
#          which already runs typecheck -> lint -> vitest(node) -> vitest(components)
#          -> build -> playwright in cheapest-first order and reconciles failures
#          against web/tests/known-issues.json. CI deliberately calls that one
#          command rather than re-listing the stages here, so the merge gate and
#          the local command cannot drift apart.
#
#   r    - the R pipeline, PARSE ONLY. This repo has zero R test files -- not
#          a `tests/` directory, not a `testthat` suite, nothing -- so the R
#          job is NBA's cheap parse-everything syntax check and nothing else.
#          A test-running step here would have no tests to run; rather than
#          fabricate a suite to fill the slot, the job does the one real check
#          available and says so. If R tests are ever written, copy NBA's
#          .github/scripts/run-tests.R and add a step.
#
#          Because nothing is evaluated, the job needs no R packages at all,
#          so it has no install step, no library cache and no
#          r-dependencies.txt. That is why it finishes in under a minute and
#          why this repo lacking a renv.lock does not block it.
#
# Nothing in CI will ever run the pipeline itself: every stage hits paid
# sports-data APIs and takes hours.
#
# No secrets are used or needed. Do not add ODDS_API_KEY or DISCORD_WEBHOOK
# here: a workflow that can reach them is a workflow a pull request from a fork
# could be made to reach them through.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Runs on main are left
# alone so the default branch keeps a complete history of results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: @playwright/test pins the browser build, so a
      # lockfile change is exactly when the cached browser goes stale.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright.config.ts declares both a desktop-chromium and a
      # mobile-chromium project; both are Chromium device profiles, so one
      # browser download covers the whole e2e stage.
      #
      # The e2e stage reports real coverage as of 2026-10-26: 213 tests across the
      # two projects. It previously ran ZERO and still said PASS 0/0, because the
      # managed webServer was `npx next start`, which exits 1 against this app
      # (web/next.config.mjs sets `output: 'export'`). It now serves the exported
      # `out/` dir via web/scripts/serve-export.mjs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own exit code is the gate: a failure listed in
      # known-issues.json is reported as KNOWN and tolerated, anything else is a
      # REGRESSION and fails. That baseline is the repo's documented policy, so
      # this is plain `npm test` and not --strict.
      - name: Run the web test suite
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn

  r:
    name: R syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # parse() only: no package is loaded and no file is evaluated, so this
      # cannot reach an API, touch cache/ or need a dependency install.
      # Measured 2026-10-26: 80 tracked .R files, 0 failures.
      - name: Parse every tracked R file
        run: Rscript .github/scripts/parse-all.R
