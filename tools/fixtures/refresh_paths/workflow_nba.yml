# FIXTURE for tools/test_check_refresh_paths_sync.mjs -- the "Commit any
# changes" step of nba/.github/workflows/refresh-results.yml.
jobs:
  refresh:
    steps:
      - name: Commit any changes
        run: |
          if [ -z "$(git status --porcelain -- web/public/data/matchups_slates.json web/public/data/landing_digest.json)" ]; then
            exit 0
          fi
          git add web/public/data/matchups_slates.json web/public/data/landing_digest.json
          git commit -m "chore(data): refresh finished game results"
          git push
