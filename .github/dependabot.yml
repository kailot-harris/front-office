version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
    ignore:
      - dependency-name: "next"
        versions: ["!=14.2.35"]
      - dependency-name: "eslint-config-next"
        versions: ["!=14.2.35"]