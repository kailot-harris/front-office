name: Refresh live results

# Fills finished game scores into the committed web JSON (web/public/data) so
# the dashboard does not carry yesterday's results between full pipeline runs.
# This is slots B and C of the converged schedule; slot A (13:00 UTC) is the
# full DAG on the workstation and remains the authority on everything else.
#
# This job deliberately does NOT run the R pipeline. It needs no renv restore,
# no API key and no cache/ directory: tools/refresh_live_results.R patches the
# already-committed JSON from the public nflverse schedule file. See the header
# of that script for what it will and will not touch - in particular, that it
# grades but never re-predicts, and that it defers any final in a week past
# active_week rather than publishing a payload the web contract suite rejects.
#
# IT DOES NOT DEPLOY. Pushing here only updates this repo; the live site is
# built from the front-office aggregator, which subtree-pulls this repo first.
# The aggregator's sync-sports.yml runs 30 minutes behind each slot and does
# that hop, so no human is in the path - but the two crons are coupled, and
# moving one without the other means publishing into a window nothing reads.

on:
  schedule:
    # Slot C - overnight. 05:00 UTC = 01:00 ET: after nflverse's ~04:30 build
    # and after every North American night game has finished and been marked
    # final. Cron is UTC-only; this does not shift with DST, which is why the
    # margin against the 04:30 build is 30 minutes rather than 5.
    - cron: '0 5 * * *'
    # Slot B - afternoon. 22:00 UTC = 18:00 ET: after nflverse's ~21:00 build,
    # so Sunday afternoon finals are in the payload before primetime.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # jsonlite only. The whole point of this script is that it does not need
      # the project's package set - renv::restore() here would pull the full
      # nflverse/duckdb stack for a job whose entire payload is one CSV and two
      # JSON files. This repo has no renv.lock to restore from in any case
      # (FOUR_REPO_COMPARISON section 5.4).
      - name: Install jsonlite
        run: install.packages("jsonlite")
        shell: Rscript {0}

      - name: Refresh results from the nflverse schedule file
        run: Rscript tools/refresh_live_results.R ${{ inputs.season || '2026' }}

      # NOTE on permissions: a repo whose default GITHUB_TOKEN scope is
      # read-only (Settings > Actions > Workflow permissions) cannot push from
      # here. The workflow-level `permissions: contents: write` above is what
      # lets this step work. Don't drop it.
      - name: Commit any changes
        run: |
          # --porcelain over the two files the script owns, not `git diff`:
          # diff only sees tracked files, and scoping to these two paths means
          # an unrelated dirty file can never be swept into a data commit.
          if [ -z "$(git status --porcelain -- web/public/data/matchups_current_week.json web/public/data/model_diagnostics.json)" ]; then
            echo "No newly finished games; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/matchups_current_week.json web/public/data/model_diagnostics.json
          git commit -m "chore(data): refresh finished game results

          Written by .github/workflows/refresh-results.yml from the public
          nflverse schedule file. Scores plus the grading that follows
          mechanically from them - no prediction was recomputed and no model
          was re-fit. The diagnostics row is reconciled rather than appended;
          the next full pipeline run rewrites it from cache/accuracy_history.rds."
          git push
