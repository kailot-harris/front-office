name: Refresh live results

# Fills finished game scores into the committed web JSON (web/public/data) so
# the dashboard — in particular the World Series banner on /postseason — does
# not go stale between pipeline runs.
#
# This job deliberately does NOT run the R pipeline. It needs no renv restore,
# no API key and no cache/ directory: tools/refresh_live_results.R patches the
# already-committed JSON from the public MLB Stats API. See the header of that
# script for what it will and will not touch.
#
# IT DOES NOT DEPLOY. Pushing here only updates this repo; the live site is
# built from the front-office aggregator, which has to subtree-pull this repo
# first (see HANDOFF.md section 2). Until that hop is automated too, a human
# still runs the sync.

on:
  schedule:
    # Slot C - overnight. 05:00 UTC = 01:00 ET: the first hour at which a full
    # night of North American games is reliably Final. Added 2026-10-27 when
    # the three-slot converged schedule was adopted; its sibling repos (NBA,
    # NFL) run their own refresh-results.yml on the same two crons, and the
    # aggregator's sync-sports.yml pulls 30 minutes behind each.
    - cron: '0 5 * * *'
    # Slot B - afternoon. 22:00 UTC = 18:00 ET: catches afternoon finals before
    # primetime.
    - cron: '0 22 * * *'
    # 11:00 UTC = 07:00 ET. This one PREDATES the converged schedule and is
    # kept deliberately: it is the only cron that fires before slot A's
    # 13:00 UTC pipeline run, so the postseason banner is already correct on
    # the site if that run is late or does not happen. It costs one jsonlite
    # install. Cron is UTC-only; none of these shift with DST.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh
        required: false
        default: '2026'

permissions:
  contents: write

concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # jsonlite only. The whole point of this script is that it does not need
      # the project's package set — renv::restore() here would reintroduce the
      # duckdb source-build problem that breaks ci.yml on Windows.
      - name: Install jsonlite
        run: install.packages("jsonlite")
        shell: Rscript {0}

      - name: Refresh results from the MLB Stats API
        run: Rscript tools/refresh_live_results.R ${{ inputs.season || '2026' }}

      # NOTE on permissions: this repo's default GITHUB_TOKEN scope is read-only
      # (Settings > Actions > Workflow permissions). The workflow-level
      # `permissions: contents: write` above is what lets this step push.
      # Don't drop it.
      - name: Commit any changes
        run: |
          # --porcelain, not `git diff`: diff only sees tracked files, so a
          # newly created JSON (world_series.json on a season that had none)
          # would read as "nothing to commit" and vanish silently.
          if [ -z "$(git status --porcelain -- web/public/data)" ]; then
            echo "No newly finished games; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git commit -m "chore(data): refresh finished game results

          Written by .github/workflows/refresh-results.yml from the public MLB
          Stats API. Scores and statuses only — no predictions were graded or
          recomputed."
          git push
