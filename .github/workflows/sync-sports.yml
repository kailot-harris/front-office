name: Sync sport subtrees and deploy

# Closes the "deploy hop": each sport repo can update itself (MLB's
# refresh-results.yml patches finished game scores into web/public/data every
# morning), but pushing there deploys nothing — the live site is built from
# THIS repo, which has to subtree-pull first. Without this workflow a human ran
# that sync by hand and the site sat a day behind the data.
#
# What it does: `git subtree pull` each requested sport, push if that produced a
# new commit, then explicitly dispatch deploy.yml.
#
# THE TRAP THIS WORKS AROUND: a push made with GITHUB_TOKEN does NOT trigger
# other workflows (GitHub suppresses it to avoid recursive runs), so deploy.yml
# will NOT fire on its own from the push below. The dispatch step is not
# belt-and-braces — it is the only thing that publishes. A `workflow_dispatch`
# IS permitted with GITHUB_TOKEN, because a dispatch is not a push event, so no
# PAT is needed. If you ever delete the dispatch step, the sync silently stops
# deploying while still looking green.

on:
  schedule:
    # 13:30 UTC = slot A + 30 minutes. Cron is UTC-only and does not shift with
    # DST, so this drifts an hour against local time twice a year, which is
    # tolerable here only because of how much slack slot A leaves (below).
    #
    # WHY 13:30 AND NOT THE OLD 11:30. The binding constraint is upstream data,
    # not this repo. Measured from the providers' own Actions history on
    # 2026-10-26:
    #   NBA   sportsdataverse/hoopR-nba-data     ~11:17-11:56, ~12:08-12:19 UTC
    #   WNBA  sportsdataverse/wehoop-wnba-data   ~10:33,       ~11:40-12:07 UTC
    #   NFL   nflverse/nflverse-pbp              ~00:00, 04:30, 09:00,
    #                                            13:00-13:40, 21:00 UTC
    #   MLB   MLB Stats API                      continuous
    # NBA and WNBA both finish by ~12:20 UTC and nothing before that has seen
    # last night's games. The four sport pipelines run at 09:00 local (13:00 UTC
    # during EDT) -- slot A -- and each publishes behind its own
    # tools/publish_web.R gate; this job pulls what they published 30 minutes
    # later. The old 11:30 was pinned to MLB's refresh-results.yml at 11:00 and
    # predates the other three sports being scheduled at all.
    - cron: '30 13 * * *'
    # Slots B (22:30 UTC) and C (05:30 UTC) crons were removed because GitHub
    # Actions schedule runners run 5-6 hours late. Workstation Task Scheduler
    # handles Slots B (18:00 local) and C (01:00 local) unattended via
    # tools/run_refresh_slot.ps1 which directly dispatches this workflow with
    # -f sports="mlb nfl nba wnba" -f deploy=true.
  workflow_dispatch:
    inputs:
      sports:
        description: Space-separated sports to sync (e.g. "mlb" or "mlb nba")
        required: false
        default: mlb nfl nba wnba
      deploy:
        description: Dispatch deploy.yml when a sync produced a new commit
        type: boolean
        required: false
        default: true

permissions:
  contents: write # push the subtree merge commit
  actions: write  # dispatch deploy.yml

concurrency:
  # Never let two syncs race on the same history; a queued one still runs after.
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # subtree pull replays the prefix's history; a shallow clone cannot do
          # it ("fatal: refusing to merge unrelated histories" at best).
          fetch-depth: 0
          # MUST stay false. Left on, checkout writes an
          # `http.https://github.com/.extraheader` Basic-auth header carrying
          # GITHUB_TOKEN into .git/config, and that header applies to EVERY
          # github.com URL -- it silently overrides the credentials in the
          # sport remote's URL below, so the fetch goes out as the
          # front-office-scoped token and the private sibling answers 404.
          # That cost three rehearsals to find: the API preflight returned 200
          # for the same repo the very next git command "could not find"
          # (run 40247192528). Both remotes are given explicit credentials
          # below instead.
          persist-credentials: false

      - name: Sync requested sport subtrees
        id: sync
        env:
          # ALL FOUR sports are scheduled as of 2026-10-26.
          #
          # This was 'mlb' alone, with the stated reason that the other three
          # were dispatch-only "so a sibling repo mid-change can never drag the
          # site into a broken build on its own". That reasoning was sound and it
          # is what has now been retired, deliberately rather than forgotten:
          # each sport repo publishes behind its own tools/publish_web.R gate,
          # which asserts on the ARTIFACTS (mtimes, an independently recomputed
          # slate, a real diff, the publish branch, exporter warnings, and the
          # generated_at stamp inside each payload) and commits NOTHING when any
          # fatal assertion fails. A sibling mid-change now blocks its own
          # publish rather than shipping, so there is nothing for this job to
          # pull and nothing to drag the site into.
          #
          # Order matters only for log readability, not correctness: each sport
          # is an independent subtree pull, and one deploy is dispatched after
          # all of them.
          SPORTS: ${{ inputs.sports || 'mlb nfl nba wnba' }}
          # The sport repos are PRIVATE and live outside this repo, and
          # GITHUB_TOKEN is scoped to this repo alone -- an anonymous clone of a
          # private sibling fails with the misleading "Repository not found"
          # (proven: run 40241008321). Reading them needs a PAT with read-only
          # Contents on the four sport repos, stored here as SUBTREE_TOKEN.
          SUBTREE_TOKEN: ${{ secrets.SUBTREE_TOKEN }}
          # Pushing back to THIS repo is all the built-in token is needed for,
          # and with persist-credentials off it has to be supplied explicitly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUBTREE_TOKEN:-}" ]; then
            echo '::error::SUBTREE_TOKEN is not set. Create a fine-grained PAT with'
            echo '::error::read-only Contents on the sport repos and add it under'
            echo '::error::Settings -> Secrets and variables -> Actions. GITHUB_TOKEN'
            echo '::error::cannot read another repository, so this cannot be skipped.'
            exit 1
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          before="$(git rev-parse HEAD)"
          synced=''

          for sport in $SPORTS; do
            # The upstream repo names are not uniform (MLB-Analytics is
            # hyphenated, the rest use an underscore), so they are mapped
            # explicitly rather than interpolated from the slug.
            case "$sport" in
              mlb)  repo=MLB-Analytics  ;;
              nba)  repo=NBA_analytics  ;;
              wnba) repo=WNBA_analytics ;;
              nfl)  repo=NFL_analytics  ;;
              *) echo "::error::unknown sport '$sport'"; exit 1 ;;
            esac

            # Preflight the token against the API before letting git try.
            # git reports BOTH "token cannot see this repo" and "no such repo"
            # as the same bare "Repository not found", which is unactionable;
            # the API distinguishes them, so translate it here once.
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${SUBTREE_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${{ github.repository_owner }}/${repo}")"
            case "$code" in
              200) echo "$sport: token can read $repo" ;;
              404) echo "::error::SUBTREE_TOKEN cannot see ${repo} (HTTP 404)."
                   echo '::error::A fine-grained PAT returns 404, not 403, for a repo'
                   echo '::error::outside its selected set. Check: resource owner is the'
                   echo "::error::repo owner, ${repo} is in Repository access, and"
                   echo '::error::Contents is Read-only. A CLASSIC PAT needs the full'
                   echo '::error::"repo" scope -- "public_repo" alone also yields 404.'
                   exit 1 ;;
              401) echo '::error::SUBTREE_TOKEN rejected (HTTP 401) -- expired, revoked,'
                   echo '::error::or the secret holds a truncated paste. Regenerate it.'
                   exit 1 ;;
              *)   echo "::error::Unexpected HTTP $code checking ${repo}."; exit 1 ;;
            esac

            remote="${sport}-origin"
            # Token in the remote URL rather than an extraheader so it is never
            # written into .git/config of the pushed tree. Actions masks the
            # secret in logs, but keep it out of any `git remote -v` echo too.
            git remote add "$remote" \
              "https://x-access-token:${SUBTREE_TOKEN}@github.com/${{ github.repository_owner }}/${repo}.git"

            sport_before="$(git rev-parse HEAD)"
            # No --squash: matches the existing merge style in this repo's
            # history, which keeps each sport's original commits reachable.
            git subtree pull --prefix="$sport" "$remote" main \
              -m "chore: subtree-pull ${sport} (automated sync)"

            if [ "$(git rev-parse HEAD)" != "$sport_before" ]; then
              echo "$sport: new commits pulled"
              synced="${synced}${synced:+, }${sport}"
            else
              echo "$sport: already up to date"
            fi
          done

          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo 'Nothing to sync; no push, no deploy.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            # Pushes the ref the job was dispatched on, not a hardcoded main, so
            # the whole path (pull, commit, push) can be rehearsed on a scratch
            # branch without main ever carrying the result.
            git push origin "HEAD:${{ github.ref_name }}"
            echo "Pushed subtree merge(s) for: $synced"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "synced=$synced" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch deploy
        # Skipped when nothing was pulled: the deployed site already matches.
        # The `schedule` arm is not redundant: on a scheduled run `inputs` is
        # empty, and an empty string coerces to 0 == false in GitHub's
        # expression casting, so testing the input alone would skip every
        # nightly deploy.
        if: |
          steps.sync.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || inputs.deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Required because the push above, being GITHUB_TOKEN-authored, does
          # not trigger deploy.yml's `on: push` (see the header note).
          gh workflow run deploy.yml --ref main
          echo "Dispatched deploy.yml for: ${{ steps.sync.outputs.synced }}"
          echo 'Verify the run, then curl the published page — a green build does'
          echo 'not prove client-side fetches resolve under the production basePath.'
