name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the web test suite (typecheck, lint, contracts, build)
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn

  r:
    name: R pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # Cheap and needs no packages, so it runs before the install step and
      # fails fast on a syntax error anywhere in the pipeline.
      - name: Parse every tracked R file
        run: Rscript .github/scripts/parse-all.R

      # The cached library holds compiled packages linked against the runner
      # image's system libraries. runner.os is just "Linux", so when
      # ubuntu-latest moved from 24.04 to 26.04 the old cache was restored onto
      # the new image and stringi failed to load (libicui18n.so.74 missing),
      # taking tidyverse and most of the suite with it. Keying on the image
      # (ImageOS, e.g. "ubuntu26") rebuilds the library when the image changes.
      - name: Record the runner image for the cache key
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-R4.5-${{ hashFiles('.github/r-dependencies.txt') }}

      - name: Install R dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript .github/scripts/install-deps.R

      - name: Run testthat unit test suite
        run: Rscript .github/scripts/run-tests.R
