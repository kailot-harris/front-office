name: CI

# CI does not run on pushes to main, with one exception noted at the push
# trigger below. Nearly every change reaches main through a
# pull request that has already run this workflow, and the scheduled data
# publishes are gated locally before they are committed, so the post-merge run
# only repeated work. Use workflow_dispatch to check main on demand.
#
# Runner selection: both jobs run on ${{ vars.CI_RUNNER || 'ubuntu-latest' }}.
# - CI_RUNNER unset or empty: GitHub-hosted ubuntu-latest (the default).
# - CI_RUNNER set to self-hosted: the self-hosted runner registered for this
#   repo.
# To switch back to GitHub-hosted runners, delete the CI_RUNNER variable or
# clear its value (repo Settings > Secrets and variables > Actions > Variables).
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # The one push that does run CI: a change to the R dependency list on main.
  # A pull request can restore caches saved on main but not ones saved by
  # another pull request, so the R library cache has to be saved from main for
  # later pull requests to reuse it. The list changes rarely.
  push:
    branches: [ main ]
    paths:
      - '.github/r-dependencies.txt'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Time limits: every job runs on the shared self-hosted runner, whose
# job-started hook waits for a host-wide lock before the first step (front-office
# tools/ci-runner/README.md). That wait counts against a job's timeout-minutes,
# so a job limit of 45 cancelled jobs that were still queued. The job limits
# are therefore 180 (the hook's worst-case 3 x 45 minute queue plus a run),
# and each step carries its own limit, which is what bounds the actual run.
# Keep a healthy job's run under the hook's 60-minute stale-lock age.
jobs:
  # The front-office site runs tools/check_fabrication_idioms.mjs on every
  # sport's R code before it deploys, so code that trips it blocks the whole
  # site's deploy after it reaches main here. This job runs the same guard, with
  # the same allowlist, on the pull request, so the failure shows up before the
  # merge. If a flagged line is a reviewed structural constant or test value,
  # add an entry to tools/fabrication_guard_allowlist.json in front-office first;
  # this job reads that file from front-office main.
  fabrication-guard:
    name: Fabrication guard (front-office)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          path: mlb

      - name: Check out the guard from front-office
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: kailot-harris/front-office
          path: _front-office
          sparse-checkout: tools

      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22

      # The guard lists every scanned file before its result; show only the result.
      - name: Run the fabrication guard
        timeout-minutes: 5
        run: |
          set -o pipefail
          node _front-office/tools/check_fabrication_idioms.mjs --root . 2>&1 | grep -vE '^\s*\[(SCAN|EXCLUDED)\]'

  web:
    name: Web suite
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci

      - name: Run the web test suite (typecheck, lint, contracts, build)
        timeout-minutes: 30
        run: npm test

      - name: Publish the suite summary
        timeout-minutes: 5
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        timeout-minutes: 10
        if: always()
        # Debug files only: a failed upload (e.g. the account's Actions storage
        # budget is used up) must not turn a passing test run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 3
          if-no-files-found: warn

  a11y:
    name: Accessibility (axe, light and dark)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      - uses: actions/setup-node@v4
        timeout-minutes: 10
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci

      - name: Build the static export
        timeout-minutes: 15
        run: npm run build

      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      # Every top-level route in light and dark mode; fails on serious or
      # critical axe violations (kailot-harris/MLB-Analytics#130).
      - name: Run the axe suite
        timeout-minutes: 20
        run: npm run test:a11y

      - name: Upload the Playwright report
        timeout-minutes: 10
        if: failure()
        # Debug files only: a failed upload (e.g. the account's Actions storage
        # budget is used up) must not turn a passing test run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-playwright-report
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn

  r:
    name: R pipeline tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'FALSE'
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - name: Check out repository
        timeout-minutes: 10
        uses: actions/checkout@v4

      - name: Set up R
        timeout-minutes: 10
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # Cheap and needs no packages, so it runs before the install step and
      # fails fast on a syntax error anywhere in the pipeline.
      - name: Parse every tracked R file
        timeout-minutes: 5
        run: Rscript .github/scripts/parse-all.R

      # Static analysis (parse-only, no packages, no execution): fails the
      # build if any tools/gif_*.R or tools/viz_*.R chart script contains a
      # code path that can draw non-data-derived values (random generators,
      # hand-typed data tables, or a missing-input fallback that fabricates a
      # data frame instead of calling viz_stop_no_data()). See
      # front-office#142 for the incident this guards against.
      - name: Check chart scripts for non-data-derived values
        timeout-minutes: 5
        run: Rscript .github/scripts/check-chart-authenticity.R

      # The cached library holds compiled packages linked against the runner
      # image's system libraries. runner.os is just "Linux", so when
      # ubuntu-latest moved from 24.04 to 26.04 the old cache was restored onto
      # the new image and stringi failed to load (libicui18n.so.74 missing),
      # taking tidyverse and most of the suite with it. Keying on the image
      # (ImageOS, e.g. "ubuntu26") rebuilds the library when the image changes.
      # A self-hosted runner does not set ImageOS (#91), so fall back to the
      # host's own OS release from /etc/os-release (e.g. "ubuntu24.04"). The
      # hosted key is unchanged because ImageOS still wins when it is set, and
      # a host OS upgrade now changes the key. "unknown" is left only for a
      # host with neither.
      - name: Record the runner image for the cache key
        timeout-minutes: 5
        run: |
          image="${ImageOS:-}"
          if [ -z "$image" ] && [ -r /etc/os-release ]; then
            image="$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          fi
          echo "RUNNER_IMAGE=${image:-unknown}" >> "$GITHUB_ENV"
          echo "R library cache key image: ${image:-unknown}"

      - name: Cache R library
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-R4.5-${{ hashFiles('.github/r-dependencies.txt') }}

      - name: Install R dependencies
        timeout-minutes: 40
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript .github/scripts/install-deps.R

      - name: Run testthat unit test suite
        timeout-minutes: 20
        run: Rscript .github/scripts/run-tests.R
