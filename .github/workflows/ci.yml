# ==============================================================================
# CI for NBA Analytics
#
# Two independent jobs, because the repo is two codebases:
#
#   web  - the Next.js app. Delegates to `npm test`, i.e. web/scripts/run-test-suite.mjs,
#          which already runs typecheck -> lint -> vitest(node) -> vitest(components)
#          -> build -> playwright in cheapest-first order and reconciles failures
#          against web/tests/known-issues.json. CI deliberately calls that one
#          command rather than re-listing the stages here, so the merge gate and
#          the local command cannot drift apart.
#   r    - the R pipeline. Parses every tracked .R file (syntax only, nothing is
#          executed), then runs tests/test_*.R.
#
# Nothing here runs the pipeline itself: every stage hits paid sports-data APIs
# and takes hours. The R job only loads stage files for their definitions, via
# NBA_SKIP_STAGE_AUTORUN=1.
#
# No secrets are used or needed. Do not add ODDS_API_KEY or DISCORD_WEBHOOK
# here: a workflow that can reach them is a workflow a pull request from a fork
# could be made to reach them through.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Runs on main are left
# alone so the default branch keeps a complete history of results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: @playwright/test pins the browser build, so a
      # lockfile change is exactly when the cached browser goes stale.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own exit code is the gate: a failure listed in
      # known-issues.json is reported as KNOWN and tolerated, anything else is a
      # REGRESSION and fails. That baseline is the repo's documented policy, so
      # this is plain `npm test` and not --strict.
      - name: Run the web test suite
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn

  r:
    name: R pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Stage entrypoints end in a call that runs the real stage. The tests load
      # them for their definitions only; without this they would hit live APIs.
      NBA_SKIP_STAGE_AUTORUN: '1'
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # Cheap and needs no packages, so it runs before the long install and
      # fails fast on a syntax error anywhere in the pipeline.
      - name: Parse every tracked R file
        run: Rscript .github/scripts/parse-all.R

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-R4.5-${{ hashFiles('.github/r-dependencies.txt') }}

      - name: Install R dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript .github/scripts/install-deps.R

      - name: Run R tests
        run: Rscript .github/scripts/run-tests.R
