# ==============================================================================
# CI for NFL Analytics
#
# Lifted from NBA Analytics's .github/workflows/ci.yml, which is a proven live
# model rather than a template. The web job below is a direct copy: this repo
# already has web/scripts/run-test-suite.mjs and web/tests/known-issues.json,
# so nothing about it needed adapting.
#
#   web  - the Next.js app. Delegates to `npm test`, i.e. web/scripts/run-test-suite.mjs,
#          which already runs typecheck -> lint -> vitest(node) -> vitest(components)
#          -> build -> playwright in cheapest-first order and reconciles failures
#          against web/tests/known-issues.json. CI deliberately calls that one
#          command rather than re-listing the stages here, so the merge gate and
#          the local command cannot drift apart.
#
# There is deliberately NO R job yet. Unlike NBA, this repo has zero R test
# files, so an R job here is the parse-everything syntax check and nothing
# else; it is tracked separately rather than shipped half-built. Nothing in CI
# will ever run the pipeline itself: every stage hits paid sports-data APIs and
# takes hours.
#
# No secrets are used or needed. Do not add ODDS_API_KEY or DISCORD_WEBHOOK
# here: a workflow that can reach them is a workflow a pull request from a fork
# could be made to reach them through.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Runs on main are left
# alone so the default branch keeps a complete history of results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: @playwright/test pins the browser build, so a
      # lockfile change is exactly when the cached browser goes stale.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright.config.ts declares both a desktop-chromium and a
      # mobile-chromium project; both are Chromium device profiles, so one
      # browser download covers the whole e2e stage.
      #
      # KNOWN HOLE, measured locally 2026-10-26: the e2e stage currently runs
      # ZERO tests and still reports PASS 0/0. playwright.config.ts's managed
      # webServer is `npx next start`, which cannot run against this app --
      # web/next.config.mjs sets `output: 'export'`, so next start exits 1 with
      # "does not work with output: export". The six specs in web/tests/e2e/
      # never execute. This step is kept because it is what the gate needs the
      # moment that is fixed (serve the exported `out/` dir instead), but until
      # then do NOT read a green web job as e2e coverage.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own exit code is the gate: a failure listed in
      # known-issues.json is reported as KNOWN and tolerated, anything else is a
      # REGRESSION and fails. That baseline is the repo's documented policy, so
      # this is plain `npm test` and not --strict.
      - name: Run the web test suite
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 14
          if-no-files-found: warn
