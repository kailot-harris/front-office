# ==============================================================================
# CI for NFL Analytics
#
# Lifted from NBA Analytics's .github/workflows/ci.yml, which is a proven live
# model rather than a template. The web job below is a direct copy: this repo
# already has web/scripts/run-test-suite.mjs and web/tests/known-issues.json,
# so nothing about it needed adapting.
#
#   web  - the Next.js app. Delegates to `npm test`, i.e. web/scripts/run-test-suite.mjs,
#          which already runs typecheck -> lint -> vitest(node) -> vitest(components)
#          -> build -> playwright in cheapest-first order and reconciles failures
#          against web/tests/known-issues.json. CI deliberately calls that one
#          command rather than re-listing the stages here, so the merge gate and
#          the local command cannot drift apart.
#
#   r    - the R pipeline syntax check + foundational pure-R unit tests.
#          Runs .github/scripts/parse-all.R across every tracked .R file and
#          .github/scripts/run-tests.R across tests/test_*.R. The unit tests
#          exercise pure functions from config.R, logging_utils.R,
#          tools/refresh_live_results.R, and tools/publish_web.R using base R only, so the job needs no CRAN
#          install step and finishes in under a minute.
#
# Nothing in CI will ever run the pipeline itself: every stage hits paid
# sports-data APIs and takes hours.
#
# No secrets are used or needed. Do not add ODDS_API_KEY or DISCORD_WEBHOOK
# here: a workflow that can reach them is a workflow a pull request from a fork
# could be made to reach them through.
#
# Runner selection: both jobs run on `${{ vars.CI_RUNNER || 'ubuntu-latest' }}`.
#   - CI_RUNNER unset or empty: GitHub-hosted ubuntu-latest (the default, and
#     the behaviour before this variable existed).
#   - CI_RUNNER = self-hosted: the self-hosted Linux runner registered for this
#     repo (see kailot-harris/front-office#151).
# To switch back to hosted runners, delete the CI_RUNNER variable or clear its
# value: repo Settings -> Secrets and variables -> Actions -> Variables.
# refresh-results.yml does not read this variable and always stays hosted.
# ==============================================================================
name: CI

# CI does not run on pushes to main, with one exception noted at the push
# trigger below. Nearly every change reaches main through a
# pull request that has already run this workflow, and the scheduled data
# publishes are gated locally before they are committed, so the post-merge run
# only repeated work. Use workflow_dispatch to check main on demand.
on:
  pull_request:
  workflow_dispatch:
  # The one push that does run CI: a change to the R dependency list on main.
  # A pull request can restore caches saved on main but not ones saved by
  # another pull request, so the R library cache has to be saved from main for
  # later pull requests to reuse it. The list changes rarely.
  push:
    branches: [ main ]
    paths:
      - '.github/r-dependencies.txt'

# A new push to a PR makes the in-flight run obsolete. Manually dispatched runs
# are left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The front-office site runs tools/check_fabrication_idioms.mjs on every
  # sport's R code before it deploys, so code that trips it blocks the whole
  # site's deploy after it reaches main here. This job runs the same guard, with
  # the same allowlist, on the pull request, so the failure shows up before the
  # merge. If a flagged line is a reviewed structural constant or test value,
  # add an entry to tools/fabrication_guard_allowlist.json in front-office first;
  # this job reads that file from front-office main.
  fabrication-guard:
    name: Fabrication guard (front-office)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45  # includes time queued for the shared runner's host CI lock
    steps:
      - uses: actions/checkout@v4
        with:
          path: nfl

      - name: Check out the guard from front-office
        uses: actions/checkout@v4
        with:
          repository: kailot-harris/front-office
          path: _front-office
          sparse-checkout: tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The guard lists every scanned file before its result; show only the result.
      - name: Run the fabrication guard
        run: |
          set -o pipefail
          node _front-office/tools/check_fabrication_idioms.mjs --root . 2>&1 | grep -vE '^\s*\[(SCAN|EXCLUDED)\]'

  web:
    name: Web suite
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile: @playwright/test pins the browser build, so a
      # lockfile change is exactly when the cached browser goes stale.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # playwright.config.ts declares both a desktop-chromium and a
      # mobile-chromium project; both are Chromium device profiles, so one
      # browser download covers the whole e2e stage.
      #
      # The e2e stage reports real coverage as of 2026-10-26: 213 tests across the
      # two projects. It previously ran ZERO and still said PASS 0/0, because the
      # managed webServer was `npx next start`, which exits 1 against this app
      # (web/next.config.mjs sets `output: 'export'`). It now serves the exported
      # `out/` dir via web/scripts/serve-export.mjs.
      #
      # That stage includes web/tests/e2e/axe.spec.ts: @axe-core/playwright (WCAG 2.2 AA)
      # on every top-level route in both colorScheme 'light' and 'dark', failing on any
      # serious or critical violation (NFL_analytics#188).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite's own exit code is the gate: a failure listed in
      # known-issues.json is reported as KNOWN and tolerated, anything else is a
      # REGRESSION and fails. That baseline is the repo's documented policy, so
      # this is plain `npm test` and not --strict.
      - name: Run the web test suite
        run: npm test

      - name: Publish the suite summary
        if: always()
        run: |
          if [ -f test-results/SUMMARY.md ]; then
            cat test-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The suite produced no test-results/SUMMARY.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure()
        # Debug files only: a failed upload (e.g. the account's Actions storage
        # budget is used up) must not turn a passing test run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results
          retention-days: 1
          if-no-files-found: warn

  r:
    name: R pipeline tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 45, not 20 (#99): on the self-hosted runner the host-wide CI lock's
    # job-started hook runs inside this job, so time spent queued behind
    # another repo's job counts against this limit (standardized to 45 across
    # web and r, matching NBA/WNBA r). The job itself takes well under a
    # minute; lock waits of ~6 minutes (351s) were observed on 2026-11-15
    # with only a few PRs in flight. Hosted runs are unaffected because they
    # finish far below either ceiling.
    timeout-minutes: 45
    env:
      R_LIBS_USER: ${{ github.workspace }}/.rlib
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      # parse() only: no package is loaded and no file is evaluated, so this
      # cannot reach an API, touch cache/ or need a dependency install.
      - name: Parse every tracked R file
        run: Rscript .github/scripts/parse-all.R

      # Static check (parse() only, no packages, no execution): fails CI if a
      # tools/gif_*.R or tools/plot_*.R chart script contains an unallowlisted
      # code path that can draw invented (non-data-derived) plotted values.
      # See kailot-harris/front-office#142 (ported from the NBA Analytics
      # pilot). Cheap, no packages needed - placed before package install.
      - name: Check chart authenticity
        run: Rscript .github/scripts/check-chart-authenticity.R

      # The tests load packages (dplyr, testthat, xgboost and others), so the
      # job installs them from .github/r-dependencies.txt into a library inside
      # the workspace and caches it. The key carries the runner image so an
      # image or host OS change rebuilds the library: ImageOS on hosted
      # runners, the host's /etc/os-release on a self-hosted one.
      - name: Record the runner image for the cache key
        run: |
          image="${ImageOS:-}"
          if [ -z "$image" ] && [ -r /etc/os-release ]; then
            image="$(. /etc/os-release && echo "${ID}${VERSION_ID}")"
          fi
          echo "RUNNER_IMAGE=${image:-unknown}" >> "$GITHUB_ENV"
          echo "R library cache key image: ${image:-unknown}"

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-R4.5-${{ hashFiles('.github/r-dependencies.txt') }}

      - name: Install R dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript .github/scripts/install-deps.R

      # Offline R tests: no network calls and no API keys. Tests that need
      # gitignored pipeline caches print [SKIP] and are counted as skipped.
      - name: Run R unit tests
        run: Rscript .github/scripts/run-tests.R
