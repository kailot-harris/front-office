name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, branch, or tag to build and deploy (e.g. main or commit SHA/tag for rollback)'
        required: false
        default: 'main'

# IMPORTANT: this must match "/<this-repo-name>" (project pages are served at
# https://<user>.github.io/<repo-name>/), so if the repo is ever renamed, change
# this too or every asset URL breaks. Leave empty only if this is ever published
# as a user/org root site (<user>.github.io).
#
# Each sport's next.config.mjs reads this to compute its own basePath
# (PAGES_BASE_PATH + "/<sport>"), which Next only applies to its own generated
# URLs - any hand-written "<img src='/...'>" or "fetch('/...')" in app code
# bypasses it and 404s in production while working fine in local dev.
#
# Fixing that takes TWO steps, and step 1 alone is a no-op in production:
#   1. prefix the hand-written path with that sport's BASE_PATH constant
#      (<sport>/web/lib/basePath.ts)
#   2. keep "env: { PAGES_BASE_PATH: repoBase }" in that sport's next.config.mjs
#      so the value is inlined into the CLIENT bundle - Next only substitutes
#      NODE_ENV and NEXT_PUBLIC_* there, so without it BASE_PATH silently
#      degrades to "/<sport>" in the browser and the paths still 404.
#
# A green build plus a 200 from curl does NOT prove this works - that is how the
# first broken fix passed review. Verify the built bundle instead. See README.md's
# "Gotcha: basePath does not rewrite hand-written asset paths" and HANDOFF.md §5.
env:
  PAGES_BASE_PATH: /front-office

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sport: [nba, wnba, mlb, nfl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # --- Data refresh (optional) ---
      # Each sport's web app reads static JSON from web/public/data, generated by
      # that sport's R ingest pipeline (e.g. daily_ingest.R / mlb_ingest.R).
      # Regenerating data in CI needs R + renv restore + live API keys as repo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.sport }}/web/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.sport }}/web
        run: npm ci

      - name: Build static export
        working-directory: ${{ matrix.sport }}/web
        run: npm run build

      - name: Upload sport artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.sport }}
          path: ${{ matrix.sport }}/web/out

  assemble-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Download all sport artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp index.html site/
          # The landing page's own assets (trophy clips and posters). These are
          # not part of any sport's Next build, so they have to be copied in
          # explicitly or every asset URL on the landing page 404s.
          cp -r assets site/
          for sport in nba wnba mlb nfl; do
            mkdir -p "site/$sport"
            cp -r "artifacts/site-$sport/." "site/$sport/"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag deployed release and record summary
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYED_REF: ${{ github.event.inputs.ref || github.ref }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "Successfully deployed $COMMIT_SHA ($DEPLOYED_REF) to $DEPLOY_URL at $TIMESTAMP"
          
          # Update rolling release tag 'release-latest' pointing to this deployed commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a release-latest -m "Deploy: $SHORT_SHA ($DEPLOYED_REF) at $TIMESTAMP"
          git push origin release-latest --force || echo "Warning: Unable to update release-latest tag"
          
          # Optional Discord notification if webhook secret exists
          if [ -n "${{ secrets.DISCORD_WEBHOOK || '' }}" ]; then
            PAYLOAD=$(cat <<EOF
          {
            "content": "🚀 **Front Office Deployed Successfully**\n- **Ref**: `$DEPLOYED_REF`\n- **Commit**: `$SHORT_SHA`\n- **URL**: $DEPLOY_URL\n- **Time**: $TIMESTAMP"
          }
          EOF
            )
            curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "${{ secrets.DISCORD_WEBHOOK }}" || true
          fi
          
          # Output step summary to GitHub Actions Run Summary
          echo "### 🚀 Front Office Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref Deployed:** `$DEPLOYED_REF`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA:** `$COMMIT_SHA`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pages URL:** $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $TIMESTAMP" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** `release-latest`" >> "$GITHUB_STEP_SUMMARY"
