name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# IMPORTANT: set this to "/<this-repo-name>" once the repo is created on GitHub
# (project pages are served at https://<user>.github.io/<repo-name>/).
# Leave empty only if this is published as a user/org root site (<user>.github.io).
env:
  PAGES_BASE_PATH: /front-office

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sport: [nba, wnba, mlb, nfl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Data refresh (optional) ---
      # Each sport's web app reads static JSON from web/public/data, generated by
      # that sport's R ingest pipeline (e.g. daily_ingest.R / mlb_ingest.R).
      # Regenerating data in CI needs R + renv restore + live API keys as repo
      # secrets (odds providers, stats providers, etc.) that aren't configured
      # yet. Until those secrets exist, this step is skipped and the build uses
      # whatever JSON is already committed in web/public/data.
      #
      # To enable real regeneration:
      #   1. Add the required secrets in Settings -> Secrets and variables -> Actions.
      #   2. Uncomment the two steps below and set `if:` to check for your secret.
      #
      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-renv@v2
      #   with:
      #     working-directory: ${{ matrix.sport }}
      # - name: Run ingest pipeline
      #   working-directory: ${{ matrix.sport }}
      #   env:
      #     ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      #   run: Rscript run_full_pipeline.R

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.sport }}/web/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.sport }}/web
        run: npm ci

      - name: Build static export
        working-directory: ${{ matrix.sport }}/web
        run: npm run build

      - name: Upload sport artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.sport }}
          path: ${{ matrix.sport }}/web/out

  assemble-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all sport artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp index.html site/
          for sport in nba wnba mlb nfl; do
            mkdir -p "site/$sport"
            cp -r "artifacts/site-$sport/." "site/$sport/"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
